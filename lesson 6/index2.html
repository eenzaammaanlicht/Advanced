<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="data"></div>
    <script>
        async function fetchData(){
            console.log("start");
            try{
                const response = await fetch("https://jsonplaceholder.typicode.com/todos/1");
                const data = await response.json();

                const dataElement = document.getElementById('data')
                const userIdElement = document.createElement('h2');
                const titleElement = document.createElement('h2');
                const completedElement = document.createElement('h2');

                userIdElement.textContent ="ID :" + data.userId;
                titleElement.textContent ="title :" + data.title;
                completedElement.textContent ="complete :" + data.completed

                dataElement.appendChild(userIdElement);
                dataElement.appendChild(titleElement);
                dataElement.appendChild(completedElement);

            }
            catch(e){
                console.log(e);
            }
        };
        fetchData();
    </script>
</body>
</html>
