<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="container"></div>
    <script>
        async function fetch () {
            try{
                const response = await fetch("https://jsonplaceholder.typicode.com/todos");
                const data = await response.json();

                const container = document.getElementById("container");

                data.forEach(todo => {
                    const todoDiv = document.createElement("div");
                    
                    const titleElement = document.createElement("p");
                    titleElement.textContent ="Title :" + todo.title;
                    
                    const completedElement = document.createElement("p");
                    completedElement.textContent = `Completed: ${todo.completed ? 'Yes' : 'No'}`;

                    todoDiv.appendChild(titleElement);
                    todoDiv.appendChild(completedElement);

                    container.appendChild(todoDiv);
                });

            } catch (e) {
                console.error(e);
            }
        };
        fetchData();
    </script>
</body>
</html>
