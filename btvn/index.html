<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hình Lăng Trụ 3D</title>
<style>
  body, html {
    height: 100%;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    perspective: 1000px;
    width: 200px; /* Chiều rộng của hình lăng trụ */
    height: 200px; /* Chiều cao của hình lăng trụ */
    position: relative;
  }
  .trapezoid {
    width: 100%;
    height: 100%;
    background: url('https://scontent.xx.fbcdn.net/v/t1.15752-9/434294840_793312898923306_5957904901060363733_n.jpg?_nc_cat=107&ccb=1-7&_nc_sid=5f2048&_nc_eui2=AeHdEH4TzIHG4E1ldv2DlSTR8FXKv0eb0AnwVcq_R5vQCUKZdR2xqPLZCI1KulYCQBVWiuuohmJ36P6qHG8AjxZM&_nc_ohc=a311GTkrf9kAb71zm1Y&_nc_ad=z-m&_nc_cid=0&_nc_ht=scontent.xx&oh=03_AdWGF3pFvUKzcRaYeLd1q8fewZXr4sR9GIDWpfwFZZYMtg&oe=663616C2') no-repeat;
    background-size: cover;
    transform-style: preserve-3d;
    position: absolute;
    top: 0;
    left: 0;
    transform: rotateX(45deg) rotateY(0deg) rotateZ(45deg);
  }
  .side {
    position: absolute;
    width: 100%;
    height: 100%;
    background: inherit;
    border: 1px solid rgba(0, 0, 0, 0.2);
  }
  .side.back {
    transform: rotateY(180deg) translateZ(-200px);
  }
  .side.bottom {
    transform: rotateX(90deg) translateZ(-100px) translateY(100px);
  }
  .side.top {
    transform: rotateX(90deg) translateZ(-100px) translateY(-100px);
  }
</style>
</head>
<body>
<div class="container">
  <div class="trapezoid">
    <div class="side bottom"></div>
    <div class="side top"></div>
    <div class="side back"></div>
  </div>
</div>
</body>
</html>
