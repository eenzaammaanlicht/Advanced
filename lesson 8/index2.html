<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="user-info"></div>
    <script>
        async function fetchData() {
    try {
        const response = await fetch("https://jsonplaceholder.typicode.com/users");
        const data = await response.json();

        const userInfoContainer = document.getElementById("user-info");

        data.forEach(user => {
            const userDiv = document.createElement("div");
            userDiv.classList.add("user-card");

            const nameElement = document.createElement("h2");
            nameElement.textContent = `Name: ${user.name}`;

            const emailElement = document.createElement("p");
            emailElement.textContent = `Email: ${user.email}`;

            const addressElement = document.createElement("p");
            const addressContent = `Address: ${user.address.street}, ${user.address.suite}, ${user.address.city}`;
            addressElement.innerHTML = `<strong>${addressContent}</strong>`;

            const companyElement = document.createElement("p");
            companyElement.textContent = `Company: ${user.company.name}`;

            userDiv.appendChild(nameElement);
            userDiv.appendChild(emailElement);
            userDiv.appendChild(addressElement);
            userDiv.appendChild(companyElement);

            userInfoContainer.appendChild(userDiv);
        });
    } catch (e) {
        console.error(e);
    }
}

fetchData();
    </script>
</body>
</html>
