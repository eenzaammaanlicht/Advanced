<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display Data from Local Storage</title>
</head>
<body>
<h1>Display Data from Local Storage</h1>

<div id="displayData"></div>

<script>
window.addEventListener("DOMContentLoaded", function() {
    const displayDiv = document.getElementById("displayData");
    
    const savedData = localStorage.getItem("savedData");
    
    if (savedData) {
        displayDiv.textContent = "Data from Local Storage: " + savedData;
    } else {
        displayDiv.textContent = "No data saved in Local Storage";
    }
});
</script>
</body>
</html>
