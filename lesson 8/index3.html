<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="todo"></div>
    <script>
        async function fetchData() {
    try {
        const response = await fetch("https://jsonplaceholder.typicode.com/users");
        const data = await response.json();

        const todoContainer = document.getElementById("todo");

        // Calculate the total number of users
        const totalUsers = data.length;

        console.log(`Total number of users: ${totalUsers}`);

        data.forEach(user => {
            const todoDiv = document.createElement("div");

            const idElement = document.createElement("h2");
            const nameElement = document.createElement("h2");
            const usernameElement = document.createElement("h2");
            const emailElement = document.createElement("h2");
            const addressElement = document.createElement("h2");
            const geoElement = document.createElement("h2");

            const phoneElement = document.createElement("p");
            const websiteElement = document.createElement("p");
            const companyElement = document.createElement("p");

            idElement.textContent = `ID: ${user.id}`;
            nameElement.textContent = `Name: ${user.name}`;
            usernameElement.textContent = `Username: ${user.username}`;
            emailElement.textContent = `Email: ${user.email}`;
            addressElement.textContent = `Address: ${user.address.street}, ${user.address.suite}, ${user.address.city}`;
            geoElement.textContent = `Geo: Lat ${user.address.geo.lat}, Lng ${user.address.geo.lng}`;

            phoneElement.textContent = `Phone: ${user.phone}`;
            websiteElement.textContent = `Website: ${user.website}`;
            companyElement.textContent = `Company: ${user.company.name}`;

            todoDiv.appendChild(idElement);
            todoDiv.appendChild(nameElement);
            todoDiv.appendChild(usernameElement);
            todoDiv.appendChild(emailElement);
            todoDiv.appendChild(addressElement);
            todoDiv.appendChild(geoElement);
            todoDiv.appendChild(phoneElement);
            todoDiv.appendChild(websiteElement);
            todoDiv.appendChild(companyElement);
            todoContainer.appendChild(todoDiv);
        });

        // Count the number of users whose email contains "gmail.com"
        const gmailUsers = data.filter(user => user.email.includes("gmail.com"));
        const gmailUsersCount = gmailUsers.length;

        console.log(`Number of users with email containing "gmail.com": ${gmailUsersCount}`);
    } catch (e) {
        console.error(e);
    }
}

fetchData();
    </script>
</body>
</html>
